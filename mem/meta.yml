name: bwa_mem
description: |
  Align paired-end reads with bwa mem and sort the result.
keywords:
  - alignment
  - bwa
  - bam
tools:
  - bwa:
      description: |
        bwa

params:
  - alignment.platform:
      type: string
      description: |
        Sequencing platform recorded as `PL:` in the @RG read group. Defaults to
        ILLUMINA when unset.
  - alignment.min_seed_length:
      type: integer
      description: |
        Minimum seed length; becomes `-k <value>`. Omit to use bwa's default.
  - alignment.min_score:
      type: integer
      description: |
        Minimum alignment score to report; becomes `-T <value>`. Omit to use
        bwa's default. Low-scoring reads are emitted as unmapped rather than
        dropped.

input:
  - reads:
      type: map/file
      description: |
        Sample metadata map and the paired FASTQ files.
      pattern: "tuple val(meta), path(r1), path(r2)"
  - index:
      type: map/file
      description: |
        Reference FASTA and its BWA index files.
      pattern: "tuple path(fasta), path(index_files)"

output:
  - bam:
      type: map/file
      description: |
        Coordinate-sorted BAM.
      pattern: "tuple val(meta), path(*.sorted.bam)"

authors:
  - "EIT Generative Biology Institute"
