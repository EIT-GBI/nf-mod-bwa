name: bwa_index
description: |
  Build a BWA index for a reference FASTA.
keywords:
  - index
  - reference
  - alignment
tools:
  - bwa:
      description: |
        bwa

params:
  - alignment.index_algorithm:
      type: string
      description: |
        Forces the bwa index algorithm; becomes `-a <value>` (`bwtsw` or `is`).
        Omit to let bwa choose from the reference size.

input:
  - fasta:
      type: map/file
      description: |
        Reference genome FASTA.
      pattern: "path(fasta)"

output:
  - index:
      type: map/file
      description: |
        The FASTA together with its .amb/.ann/.bwt/.pac/.sa index files.
      pattern: "tuple path(fasta), path(fasta.*)"

authors:
  - "EIT Generative Biology Institute"
